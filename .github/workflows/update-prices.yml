name: Atualizar preços Prezzora
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Atualizar dados do feed autorizado
        env:
          PREZZORA_FEED_URL: ${{ secrets.PREZZORA_FEED_URL }}
        run: python scripts/update_prices.py
      - name: Publicar dados somente se mudaram
        run: |
          if [ -f data/offers.json ] && ! git diff --quiet -- data/offers.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/offers.json
            git commit -m "Atualizar preços verificados"
            git push
          fi
